[package]
name = "wireant"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-complex = "0.4.6"
rayon = "1.12.0"
rfd = "0.18.0"

[profile.dev]
opt-level = 2
debug = false

[profile.release]
opt-level = 3
