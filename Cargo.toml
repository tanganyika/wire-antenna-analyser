[package]
name = "wireant"
version = "0.2.0"
edition = "2024"
description = "Desktop program for modelling wire antennas (MININEC, wiremom and NEC-2 engines)"
license = "GPL-3.0-or-later"
repository = "https://github.com/tanganyika/wire-antenna-analyser"

[dependencies]
dirs = "6"
eframe = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
num-complex = "0.4.6"
rayon = "1.12.0"
rfd = "0.18.0"
wiremom = { git = "https://github.com/tanganyika/wiremom", branch = "master" }

[profile.dev]
opt-level = 2
debug = false

[profile.release]
opt-level = 3

[build-dependencies]
cc = "1"
winresource = "0.1"
